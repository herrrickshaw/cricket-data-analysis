# Shared health workflow (R variant), rolled out across the herrrickshaw repos on 2026-10-26.
# This repo is R-only: the offline test script under tests/ is the whole suite.
name: Health

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: R tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("dplyr", "tibble"))'
      - name: Tests
        run: Rscript tests/test_analysis_functions.R
